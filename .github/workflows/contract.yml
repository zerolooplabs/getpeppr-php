name: Sandbox contract

# Real calls against the getpeppr sandbox, every week and on demand.
# Needs a dedicated sandbox account: GETPEPPR_SANDBOX_API_KEY (standard key)
# and GETPEPPR_SANDBOX_MASTER_API_KEY (master key of a platform account),
# both stored as repository secrets. Without them, the job is skipped.
on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: sandbox-contract
  cancel-in-progress: false

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      HAS_KEYS: ${{ secrets.GETPEPPR_SANDBOX_API_KEY != '' && secrets.GETPEPPR_SANDBOX_MASTER_API_KEY != '' }}
    steps:
      - name: Skip without sandbox keys
        if: env.HAS_KEYS != 'true'
        run: echo "::notice::Sandbox keys are not configured; contract tests skipped."
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        if: env.HAS_KEYS == 'true'
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        if: env.HAS_KEYS == 'true'
        with:
          php-version: '8.4'
          coverage: none
          tools: composer:v2
      - name: Install dependencies
        if: env.HAS_KEYS == 'true'
        run: composer update --no-interaction --no-progress
      - name: Contract tests
        if: env.HAS_KEYS == 'true'
        env:
          GETPEPPR_CONTRACT_SEND: '1'
          GETPEPPR_SANDBOX_API_KEY: ${{ secrets.GETPEPPR_SANDBOX_API_KEY }}
          GETPEPPR_SANDBOX_MASTER_API_KEY: ${{ secrets.GETPEPPR_SANDBOX_MASTER_API_KEY }}
        run: composer test:contract
      - name: Open an issue on failure
        if: failure() && env.HAS_KEYS == 'true' && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --repo "$GITHUB_REPOSITORY" \
            --title "Sandbox contract failed ($(date -u +%Y-%m-%d))" \
            --body "The weekly contract run against the getpeppr sandbox failed: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
