name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: PHP ${{ matrix.php }}${{ matrix.lowest && ' (lowest dependencies)' || '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']
        lowest: [false]
        include:
          - php: '8.2'
            lowest: true
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ matrix.php }}
          extensions: json, hash
          coverage: none
          tools: composer:v2
          ini-values: zend.exception_ignore_args=0
      - name: Validate composer.json
        run: composer validate --strict
      - name: Install dependencies
        run: composer update --no-interaction --no-progress ${{ matrix.lowest && '--prefer-lowest --prefer-stable' || '' }}
      - name: Static analysis
        if: ${{ !matrix.lowest }}
        run: composer analyse
      - name: Unit tests
        run: composer test
      - name: Audit dependencies
        run: composer audit
